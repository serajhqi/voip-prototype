services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voip-server
    restart: unless-stopped
    environment:
      - PORT=3080
      - NODE_ENV=production
    expose:
      - "3080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - voip-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: voip-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - voip-network

networks:
  voip-network:
    name: voip-network
    driver: bridge
