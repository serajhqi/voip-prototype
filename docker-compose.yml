services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
    container_name: voip-server
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=3080
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      network: host
    container_name: voip-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      server:
        condition: service_healthy
