# Nginx Virtual Host for llm.serajhqi.ir -> omniroute container

server {
    listen 80;
    listen [::]:80;
    server_name llm.serajhqi.ir;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Allow large payloads (e.g., file uploads, audio, multi-turn contexts)
    client_max_body_size 100M;

    location / {
        # Docker internal DNS resolver allows Nginx to start even if omniroute is temporarily down
        resolver 127.0.0.11 valid=30s ipv6=off;
        
        # Adjust the port if omniroute listens on a different port (e.g. 8000, 3000, or 8080)
        set $omniroute_upstream http://omniroute:20128;
        proxy_pass $omniroute_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for interactive chat / agents)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable buffering for real-time LLM token streaming (SSE / Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extended timeouts for long LLM inference runs
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

